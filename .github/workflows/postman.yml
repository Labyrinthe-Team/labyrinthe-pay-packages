# Collection Postman (postman/) : la collection versionnée doit correspondre à la spec, et chaque
# opération de la spec doit avoir sa requête (Newman sur une API simulée).
name: postman

on:
  push:
    branches: [master]
    paths: ['openapi/**', 'postman/**', '.github/workflows/postman.yml']
  pull_request:
    paths: ['openapi/**', 'postman/**', '.github/workflows/postman.yml']

permissions:
  contents: read

concurrency:
  group: postman-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: postman

jobs:
  check:
    name: Collection up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: postman/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
