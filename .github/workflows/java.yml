# SDK Java (java/) : ./mvnw verify sur JDK 17 et 21 (tests unitaires et contrat OpenAPI, SpotBugs, Javadoc ;
# formatage Spotless sur JDK 21).
name: java

on:
  push:
    branches: [master]
    paths: ['java/**', 'openapi/**', '.github/workflows/java.yml']
  pull_request:
    paths: ['java/**', 'openapi/**', '.github/workflows/java.yml']

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: java

jobs:
  verify:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            java/*/pom.xml
            java/.mvn/wrapper/maven-wrapper.properties
      - run: ./mvnw -B -ntp verify
