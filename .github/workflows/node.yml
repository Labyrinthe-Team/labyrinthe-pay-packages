# SDK Node.js / TypeScript (node/) : types, tests (dont contrat OpenAPI) et contrôle du build sur Node 18 → 24.
name: node

on:
  push:
    branches: [master]
    paths: ['node/**', 'openapi/**', '.github/workflows/node.yml']
  pull_request:
    paths: ['node/**', 'openapi/**', '.github/workflows/node.yml']

permissions:
  contents: read

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: node

jobs:
  tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Le build doit s'importer (ESM) et se charger (CJS) sur chaque version supportée.
      - run: npm run build
      - run: npm run check:dist
