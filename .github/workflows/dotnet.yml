# SDK .NET (dotnet/) : build (avertissements = erreurs), tests unitaires + contrat OpenAPI et pack,
# avec les SDK .NET 8 et 9, sur Linux et Windows.
name: dotnet

on:
  push:
    branches: [master]
    paths: ['dotnet/**', 'openapi/**', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['dotnet/**', 'openapi/**', '.github/workflows/dotnet.yml']

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dotnet

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: SDK ${{ matrix.sdk }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdk: ['8.0.x', '9.0.x']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink / builds déterministes

      # Le runtime 8.0 est toujours installé : les tests ciblent net8.0. global.json (rollForward latestMajor)
      # sélectionne le SDK le plus récent installé, donc celui de la matrice.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            ${{ matrix.sdk }}

      - run: dotnet restore Labyrinthe.LabPay.sln
      - run: dotnet build Labyrinthe.LabPay.sln -c Release --no-restore -warnaserror
      - run: dotnet test Labyrinthe.LabPay.sln -c Release --no-build
      - name: Pack (nupkg + snupkg)
        run: |
          dotnet pack src/Labyrinthe.LabPay/Labyrinthe.LabPay.csproj -c Release --no-build -o artifacts
          dotnet pack src/Labyrinthe.LabPay.AspNetCore/Labyrinthe.LabPay.AspNetCore.csproj -c Release --no-build -o artifacts
