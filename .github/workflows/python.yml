# SDK Python (python/) : mypy --strict, tests (dont contrat OpenAPI) sur Python 3.9 → 3.13,
# build + twine check et installation du wheel seul.
name: python

on:
  push:
    branches: [master]
    paths: ['python/**', 'openapi/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', 'openapi/**', '.github/workflows/python.yml']

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  tests:
    name: Python ${{ matrix.python }}
    # ubuntu-24.04 : Python 3.9 n'est plus fourni pour ubuntu-latest.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -e . build twine
      - run: python -m mypy
      - run: python -m pytest
      - run: python -m build
      - run: twine check --strict dist/*
      # Le wheel doit s'installer et s'importer seul (httpx pour unique dépendance).
      - name: Install the wheel in a fresh virtualenv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import labpay; print(labpay.__version__)"
