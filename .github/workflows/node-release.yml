# Publication de @labyrinthe/labpay sur npm, déclenchée par un tag node-vX.Y.Z.
#
# Prérequis :
#   - secret NPM_TOKEN (environnement « npm ») : jeton npm granular (droit publish) d'un membre
#     de l'organisation npm @labyrinthe ;
#   - la version de node/package.json et de node/src/version.ts doit être X.Y.Z.
#
# --provenance publie l'attestation de build (Sigstore) : elle exige id-token: write et un dépôt public.
name: node-release

on:
  push:
    tags:
      - 'node-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: node-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: node

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Check that the tag matches the package version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#node-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not SemVer (expected node-vX.Y.Z)"; exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          src="$(sed -nE "s/^export const VERSION = '([^']+)';.*/\1/p" src/version.ts)"
          if [[ "$pkg" != "$version" || "$src" != "$version" ]]; then
            echo "::error::package.json is $pkg, src/version.ts is $src, but the tag is $version"; exit 1
          fi
          # Prerelease (1.1.0-beta.1) → dist-tag « next » au lieu de « latest ».
          if [[ "$version" == *-* ]]; then echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"; else echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"; fi

      - run: npm ci
      # typecheck + tests + build + contrôle du build (ESM et CJS).
      - run: npm run check
      - run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
